name: tests

on:
  push:
    branches: [ "main", "develop" , "dev" ]
  pull_request:
    branches: develop

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        go-version: [ "1.24.0" ]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    steps:
      -
        name: setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      -
        name: checkout
        uses: actions/checkout@v4
      -
        name: simple test
        run: go test -v ./...
      -
        name: test with GC pressure
        run: go test -v ./...
        env:
          GOGC: 1
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
      - name: checkout
        uses: actions/checkout@v4
      - name: measure coverage
        run: CGO_ENABLED=0 go test -v -coverprofile=coverage.out ./...
      - name: report coverage
        run: bash <(curl -s https://codecov.io/bash)

  riscv-qemu:
    name: RISC-V (QEMU Ubuntu image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU binfmt (riscv64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Pull Cloud-V RISC-V QEMU Ubuntu image
        run: docker pull cloudv10x/riscv-qemu-ubuntu:latest

      - name: Start RISC-V VM container
        run: |
          docker rm -f riscv-vm 2>/dev/null || true
          docker run -d --name riscv-vm \
            -e BOOT_TIMEOUT=900 \
            -v "$GITHUB_WORKSPACE":/workspace \
            cloudv10x/riscv-qemu-ubuntu:latest start

      - name: Stream logs and wait for boot ready
        run: |
          set -euo pipefail

          # stream logs live (background) so you see VM progress in the Actions UI
          docker logs -f riscv-vm &
          LOGS_PID=$!

          # wait for your final message from user-init
          READY_RE="RISC-V Ubuntu image is ready"
          for i in $(seq 1 90); do  # ~15 minutes at 10s intervals
            if docker logs riscv-vm 2>&1 | grep -F "$READY_RE" >/dev/null; then
              echo "::notice::VM reports ready: $READY_RE"
              kill "$LOGS_PID" || true
              exit 0
            fi
            sleep 10
          done

          echo "::warning::Timed out waiting for ready message; proceeding anyway."
          kill "$LOGS_PID" || true
          exit 0

      - name: Run tests inside guest (guest-exec if present, else GOARCH=riscv64)
        run: |
          set -euo pipefail
          echo "Checking for /opt/scripts/guest-exec in outer container..."
          if docker exec riscv-vm bash -lc 'test -x /opt/scripts/guest-exec'; then
            echo "Found guest-exec; executing tests inside the RISC-V guest."
            docker exec -e CGO_ENABLED=0 riscv-vm bash -lc \
              '/opt/scripts/guest-exec "bash -lc '\''cd /workspace && (go version || (sudo apt-get update && sudo apt-get -y install golang)) && go test -v ./...'\''"'
          else
            echo "guest-exec not found; falling back to binfmt (GOARCH=riscv64) in the outer container."
            docker exec -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=riscv64 riscv-vm bash -lc '
              set -e
              if ! command -v go >/dev/null 2>&1; then
                apt-get update && apt-get install -y golang
              fi
              cd /workspace
              go env
              go build ./...
              go test -v ./...
            '
          fi

      - name: Stop container
        if: always()
        run: docker rm -f riscv-vm || true

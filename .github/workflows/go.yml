name: tests

on:
  push:
    branches: [ "main", "develop" , "dev" ]
  pull_request:
    branches: develop

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        go-version: [ "1.24.0" ]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 0
    steps:
      -
        name: setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      -
        name: checkout
        uses: actions/checkout@v4
      -
        name: simple test
        run: go test -v ./...
      -
        name: test with GC pressure
        run: go test -v ./...
        env:
          GOGC: 1
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
      - name: checkout
        uses: actions/checkout@v4
      - name: measure coverage
        run: CGO_ENABLED=0 go test -v -coverprofile=coverage.out ./...
      - name: report coverage
        run: bash <(curl -s https://codecov.io/bash)

  riscv-qemu:
    name: RISC-V (QEMU Ubuntu image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable binfmt so we can run riscv64 userland if we fall back to cross-running
      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Pull Cloud-V RISC-V QEMU Ubuntu image
        run: docker pull cloudv10x/riscv-qemu-ubuntu:latest

      - name: Start RISC-V VM container
        run: |
          # Clean up if a previous run left leftovers
          docker rm -f riscv-vm 2>/dev/null || true

          # Mount the repo into the container so both outer container and VM can access it (your image may expose it inside guest).
          docker run -d --name riscv-vm \
            -e BOOT_TIMEOUT=900 \
            -v "$GITHUB_WORKSPACE":/workspace \
            cloudv10x/riscv-qemu-ubuntu:latest start

      - name: Wait for VM boot (best-effort)
        run: |
          set -euo pipefail
          # Wait up to ~12 minutes for a clear readiness line; adjust the grep to match your image logs.
          for i in $(seq 1 72); do
            if docker logs riscv-vm 2>&1 | grep -E "Booting completed|VM ready|✓ RISC-V VM boot - PASSED"; then
              echo "VM reports ready."
              exit 0
            fi
            sleep 10
          done
          echo "Warning: Did not detect a ready message; attempting to proceed anyway." >&2
          exit 0

      - name: Run tests inside guest if helper exists; otherwise fall back to riscv64 usermode
        run: |
          set -euo pipefail
          echo "Attempting in-guest execution via /opt/scripts/guest-exec (if available)..."
          if docker exec riscv-vm bash -lc 'test -x /opt/scripts/guest-exec'; then
            # Assumes your image provides a guest execution bridge that runs the command inside the RISC-V Ubuntu VM.
            docker exec -e CGO_ENABLED=0 riscv-vm bash -lc \
              '/opt/scripts/guest-exec "bash -lc '\''cd /workspace && go version || sudo apt-get update && sudo apt-get install -y golang && go test -v ./...'\''"'
          else
            echo "guest-exec not found; running in outer container with GOARCH=riscv64 (binfmt)."
            docker exec -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=riscv64 riscv-vm bash -lc '
              set -e
              # Ensure Go is present in the outer container (if your image already has it, this is a no-op or can be removed)
              if ! command -v go >/dev/null 2>&1; then
                apt-get update && apt-get install -y golang
              fi
              cd /workspace
              go env
              go build ./...
              go test -v ./...
            '
          fi

      - name: Stop container
        if: always()
        run: docker rm -f riscv-vm || true
